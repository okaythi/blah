<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2666f" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ef3340" stop-opacity="1" />
      <stop offset="100%" stop-color="#d9212d" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background Glow -->
  <circle cx="60" cy="60" r="50" fill="url(#glow)" />
  <!-- Core Dot -->
  <circle cx="60" cy="60" r="30" fill="#ef3340" />
  <!-- Inner Highlight -->
  <circle cx="50" cy="50" r="15" fill="#ffffff" opacity="0.15" />
</svg>